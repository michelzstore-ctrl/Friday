<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05090f">
  <meta name="description" content="FRIDAY personal assistant interface">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/friday.svg" type="image/svg+xml">
  <title>FRIDAY</title>
  <style>
    :root { color-scheme: dark; --cyan:#58e8ff; --muted:#71909e; --bg:#05090f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; background:radial-gradient(ellipse at 50% 35%,#10222e 0%,#071019 38%,#03060a 78%); color:#dffaff; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow-x:hidden; }
    .scanlines { pointer-events:none; position:fixed; inset:0; opacity:.13; z-index:4; background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(88,232,255,.12) 4px); }
    .shell { min-height:100dvh; max-width:620px; margin:auto; padding:calc(22px + env(safe-area-inset-top)) 20px calc(26px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
    header { display:flex; justify-content:space-between; align-items:center; letter-spacing:.2em; font-size:11px; color:var(--muted); }
    .dot { width:7px;height:7px;display:inline-block;border-radius:50%;background:#53ffb4;box-shadow:0 0 12px #53ffb4;margin-right:7px; }
    .hero { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:30px 0; }
    .core { width:min(62vw,230px); aspect-ratio:1; position:relative; display:grid;place-items:center; margin-bottom:30px; }
    .ring { position:absolute; inset:5%; border:1px solid rgba(88,232,255,.55); border-radius:50%; box-shadow:0 0 24px rgba(88,232,255,.09),inset 0 0 20px rgba(88,232,255,.08); animation:spin 14s linear infinite; }
    .ring:before,.ring:after { content:"";position:absolute;border:1px solid rgba(88,232,255,.25);border-radius:50%;inset:12%; }
    .ring:after { inset:25%; border-style:dashed; animation:spin 9s linear infinite reverse; }
    .orbit { position:absolute; width:9px;height:9px;background:var(--cyan);border-radius:50%;top:7%;left:28%;box-shadow:0 0 14px var(--cyan); }
    .logo { font-size:clamp(48px,14vw,76px); font-weight:200; letter-spacing:.13em; margin-left:.13em; color:#e8fcff; text-shadow:0 0 22px rgba(88,232,255,.35); }
    .sub { font-size:11px; letter-spacing:.32em; color:var(--cyan); margin-top:9px; }
    .status { margin-top:28px; color:#8bb2c0; font:12px ui-monospace,SFMono-Regular,monospace; letter-spacing:.06em; min-height:18px; }
    .meter { width:min(290px,80%);height:2px;background:#19313d;margin:14px auto 0;overflow:hidden; }
    .meter span { display:block;width:0;height:100%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:load 3.1s ease-out forwards; }
    .panel { border:1px solid rgba(88,232,255,.2); background:rgba(4,14,22,.72); border-radius:14px; padding:16px; box-shadow:0 12px 40px rgba(0,0,0,.2); }
    .panel h2 { font-size:11px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin:0 0 12px; }
    .row { display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;padding:8px 0;border-bottom:1px solid rgba(88,232,255,.08); }
    .row:last-child { border-bottom:0; }
    .ok { color:#61ffb5;font:11px ui-monospace,monospace; }
    .actions { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px; }
    button { min-height:46px;border:1px solid rgba(88,232,255,.42);border-radius:10px;background:rgba(10,37,49,.72);color:#dffaff;font-weight:600;letter-spacing:.03em;font-size:13px;padding:10px; }
    button:active { transform:scale(.985); background:#123443; }
    .note { text-align:center;color:#557481;font-size:10px;line-height:1.5;margin-top:16px; }
    .online .status { color:#61ffb5; }
    .online .meter span { width:100%; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes load { to { width:100%; } }
    @media (prefers-reduced-motion: reduce) { *,*:before,*:after { animation-duration:.01ms !important; } }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <main class="shell" id="app">
    <header><span><span class="dot"></span>PERSONAL SYSTEM</span><span>BUILD 01.0</span></header>
    <section class="hero">
      <div class="core" aria-hidden="true">
        <div class="ring"><span class="orbit"></span></div>
        <div><div class="logo">F</div><div class="sub">FRIDAY AI</div></div>
      </div>
      <div class="status" id="status" aria-live="polite">INITIALIZING SYSTEM...</div>
      <div class="meter"><span></span></div>
    </section>
    <section class="panel">
      <h2>SYSTEM DIAGNOSTICS</h2>
      <div class="row"><span>Interface</span><span class="ok">READY</span></div>
      <div class="row"><span>Local storage</span><span class="ok" id="storage">CHECKING</span></div>
      <div class="row"><span>Voice access</span><span id="voice" class="ok">AVAILABLE ON REQUEST</span></div>
      <div class="actions">
        <button id="boot">RESTART SEQUENCE</button>
        <button id="speak">TEST VOICE</button>
      </div>
    </section>
    <p class="note">FRIDAY PERSONAL ASSISTANT · STARTUP SIMULATION<br>Voice features depend on your browser and device permissions.</p>
  </main>
<script>
  const messages = [
    "INITIALIZING SYSTEM...",
    "CHECKING LOCAL INTERFACE...",
    "LOADING PERSONAL WORKSPACE...",
    "VERIFYING MODULES...",
    "ALL BASIC SYSTEMS READY.",
    "BOOT COMPLETE — FRIDAY ONLINE."
  ];
  const statusEl = document.getElementById("status");
  const app = document.getElementById("app");
  function bootSequence() {
    app.classList.remove("online");
    statusEl.textContent = messages[0];
    let i = 0;
    const showNext = () => {
      i++;
      if (i < messages.length) {
        statusEl.textContent = messages[i];
        setTimeout(showNext, 620);
      } else {
        app.classList.add("online");
        statusEl.textContent = messages[messages.length - 1];
      }
    };
    setTimeout(showNext, 450);
  }
  document.getElementById("boot").addEventListener("click", bootSequence);
  document.getElementById("speak").addEventListener("click", () => {
    if (!("speechSynthesis" in window)) {
      statusEl.textContent = "VOICE NOT SUPPORTED IN THIS BROWSER.";
      return;
    }
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance("Hello. Friday is online and ready.");
    utterance.rate = 0.92;
    speechSynthesis.speak(utterance);
  });
  try {
    localStorage.setItem("friday_test", "ok");
    document.getElementById("storage").textContent = "READY";
  } catch(e) {
    document.getElementById("storage").textContent = "LIMITED";
  }
  document.getElementById("voice").textContent = ("speechSynthesis" in window) ? "AVAILABLE ON REQUEST" : "NOT SUPPORTED";
  bootSequence();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
</script>
</body>
</html>
